name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      docker_username:
        required: true
      docker_token:
        required: true
    outputs:
      image_url:
        description: "Full image path"
        value: ${{ jobs.docker.outputs.url }}

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.push.outputs.image_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}
      - run: docker build -t ${{ inputs.image_name }}:${{ inputs.tag }} .
      - id: push
        run: |
          docker push ${{ inputs.image_name }}:${{ inputs.tag }}
          echo "image_url=${{ inputs.image_name }}:${{ inputs.tag }}" >> $GITHUB_OUTPUT
