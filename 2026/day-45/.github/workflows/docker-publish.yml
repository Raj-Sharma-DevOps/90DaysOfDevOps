name: Docker Publish

on:
  push:
    branches: [main, "feature/**"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-manager-api:${{ github.sha }} .

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag and push
        if: github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker tag task-manager-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/task-manager-api:latest
          docker tag task-manager-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/task-manager-api:sha-$SHORT_SHA
          docker push ${{ secrets.DOCKER_USERNAME }}/task-manager-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/task-manager-api:sha-$SHORT_SHA
