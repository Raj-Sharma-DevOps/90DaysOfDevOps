---
- name: Install and configure Nginx
  hosts: webservers
  become: true
  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: true

    - name: Start and enable Nginx
      service:
        name: nginx
        state: started
        enabled: true

    - name: Copy index page
      copy:
        content: "<h1>Managed by Ansible</h1>"
        dest: /var/www/html/index.html

    - name: Allow HTTP through firewall
      ufw:
        rule: allow
        port: "80"
        proto: tcp
