services:
  app:
    build: ./app
    container_name: task-manager-api
    ports:
      - "${APP_PORT:-5000}:5000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - task-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: task-manager-db
    environment:
      POSTGRES_DB: ${DB_NAME:-taskdb}
      POSTGRES_USER: ${DB_USER:-devops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devops123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - task-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devops} -d ${DB_NAME:-taskdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

networks:
  task-network:
    driver: bridge

volumes:
  postgres-data:
